<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marcos Cobo Slides</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Solo los tokens de AURORA, no el shell de deck -->
  <style>
    /* ── Tokens (mismos que aurora.css) ── */
    :root {
      --ink:        #0B0F1A;
      --ink-soft:   #131826;
      --ink-line:   #1F2638;
      --cream:      #F5EFE3;
      --text:       #ECEAE3;
      --text-muted: #8B8D98;
      --violet:     #7B4DFF;
      --cyan:       #00D4FF;
      --amber:      #FFB627;
      --rose:       #FF5B7A;
      --aurora:     linear-gradient(135deg, #7B4DFF 0%, #00D4FF 100%);
      --aurora-soft: linear-gradient(135deg, rgba(123,77,255,0.14) 0%, rgba(0,212,255,0.14) 100%);
      --ff-display: 'Space Grotesk', system-ui, sans-serif;
      --ff-body:    'Inter', system-ui, sans-serif;
      --ff-mono:    'JetBrains Mono', monospace;
      --ease-out:   cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--ink);
      color: var(--text);
      font-family: var(--ff-body);
      -webkit-font-smoothing: antialiased;
    }

    /* ── Fullscreen wrapper ── */
    .ix {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 3.5vh 4vw 3vh;
      overflow: hidden;
    }

    /* Grain */
    .ix::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.04;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      mix-blend-mode: overlay;
    }
    .ix > * { position: relative; z-index: 1; }

    /* Ambient blobs */
    .ix-blob {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .ix-blob-1 {
      width: 40vw; height: 40vw;
      background: radial-gradient(circle, rgba(123,77,255,0.09) 0%, transparent 68%);
      top: -15vw; right: -10vw;
      animation: ix-drift1 28s ease-in-out infinite;
    }
    .ix-blob-2 {
      width: 28vw; height: 28vw;
      background: radial-gradient(circle, rgba(0,212,255,0.07) 0%, transparent 68%);
      bottom: -10vw; left: 15vw;
      animation: ix-drift2 22s ease-in-out infinite;
    }
    @keyframes ix-drift1 {
      0%,100% { transform: translate(0,0); }
      50%      { transform: translate(3vw, -2vw); }
    }
    @keyframes ix-drift2 {
      0%,100% { transform: translate(0,0); }
      50%      { transform: translate(-2vw, 3vw); }
    }
    @keyframes ix-rise {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Header ── */
    .ix-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 2vh;
      border-bottom: 1px solid var(--ink-line);
      flex-shrink: 0;
      animation: ix-rise 0.5s var(--ease-out) both;
    }
    .ix-brand {
      display: flex;
      align-items: center;
      gap: 0.8vw;
    }
    .ix-brand-mark {
      width: 2.2rem; height: 2.2rem;
      background: var(--aurora);
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-family: var(--ff-display);
      font-weight: 700;
      font-size: 0.72rem;
      color: #fff;
      flex-shrink: 0;
      letter-spacing: -0.03em;
    }
    .ix-brand-name {
      font-family: var(--ff-display);
      font-size: clamp(14px, 1.1vw, 18px);
      font-weight: 600;
      color: var(--text-muted);
      line-height: 1;
    }
    .ix-brand-name strong {
      background: var(--aurora);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
    }
    .ix-header-center {
      font-family: var(--ff-mono);
      font-size: clamp(10px, 0.75vw, 13px);
      letter-spacing: 0.14em;
      color: var(--text-muted);
      text-transform: uppercase;
    }
    .ix-header-right {
      font-family: var(--ff-mono);
      font-size: clamp(10px, 0.75vw, 13px);
      color: var(--text-muted);
    }
    .ix-header-right-group {
      display: flex;
      align-items: center;
      gap: clamp(12px, 1.2vw, 20px);
    }

    /* ── Language toggle ── */
    .ix-lang-toggle {
      display: inline-flex;
      border: 1px solid var(--ink-line);
      border-radius: 999px;
      padding: 3px;
      gap: 2px;
      background: var(--ink-soft);
      flex-shrink: 0;
    }
    .ix-lang-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--ff-mono);
      font-size: clamp(10px, 0.72vw, 12px);
      font-weight: 600;
      letter-spacing: 0.06em;
      padding: 5px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .ix-lang-btn:hover { color: var(--text); }
    .ix-lang-btn.is-active {
      background: var(--aurora);
      color: #fff;
    }
    .ix-course-sub-lang {
      color: var(--text-muted);
      opacity: 0.7;
      font-style: italic;
    }

    /* ── Body ── */
    .ix-body {
      display: flex;
      flex: 1;
      min-height: 0;
      gap: 0;
      margin-top: 2.5vh;
      animation: ix-rise 0.55s var(--ease-out) 0.08s both;
    }

    /* ── Sidebar ── */
    .ix-sidebar {
      width: clamp(200px, 18vw, 280px);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 2.8vh;
      padding-right: 2vw;
      border-right: 1px solid var(--ink-line);
    }
    .ix-sidebar-label {
      font-family: var(--ff-mono);
      font-size: clamp(10px, 0.7vw, 12px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.6vh;
      display: flex;
      align-items: center;
      gap: 0.5vw;
    }
    .ix-sidebar-label::before {
      content: '';
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--violet);
      box-shadow: 0 0 8px var(--violet);
      flex-shrink: 0;
    }

    #course-list {
      display: flex;
      flex-direction: column;
      gap: 2vh;
    }

    .ix-course-card {
      width: 100%;
      background: none;
      border: 1px solid var(--ink-line);
      border-radius: 12px;
      padding: clamp(14px, 1.6vh, 20px) clamp(14px, 1.2vw, 20px);
      cursor: pointer;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 0.8vh;
      transition: border-color 0.2s ease, background 0.2s ease;
      position: relative;
      overflow: hidden;
      color: var(--text);
    }
    .ix-course-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 3px;
      background: var(--aurora);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .ix-course-card:hover  { background: var(--ink-soft); }
    .ix-course-card.is-active { background: var(--ink-soft); border-color: rgba(123,77,255,0.35); }
    .ix-course-card.is-active::before { opacity: 1; }

    .ix-course-title {
      font-family: var(--ff-display);
      font-size: clamp(13px, 1vw, 16px);
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }
    .ix-course-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .ix-course-sub {
      font-family: var(--ff-mono);
      font-size: clamp(9px, 0.65vw, 11px);
      color: var(--text-muted);
      letter-spacing: 0.06em;
    }
    .ix-course-badge {
      font-family: var(--ff-mono);
      font-size: clamp(9px, 0.65vw, 11px);
      padding: 3px 8px;
      border-radius: 20px;
      background: rgba(123,77,255,0.15);
      color: var(--violet);
      border: 1px solid rgba(123,77,255,0.25);
      transition: background 0.2s, color 0.2s, border-color 0.2s;
    }
    .ix-course-card.is-active .ix-course-badge {
      background: var(--aurora);
      color: #fff;
      border-color: transparent;
    }

    /* ── Content ── */
    .ix-content {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      padding-left: clamp(24px, 2.5vw, 48px);
    }

    .ix-content-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px 32px;
      flex-wrap: wrap;
      padding-bottom: 2vh;
      border-bottom: 1px solid var(--ink-line);
      flex-shrink: 0;
    }
    .ix-content-title {
      font-family: var(--ff-display);
      font-size: clamp(22px, 2.4vw, 36px);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1;
      margin-bottom: 0.7vh;
    }
    .ix-content-title span {
      background: var(--aurora);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .ix-content-subtitle {
      font-family: var(--ff-mono);
      font-size: clamp(10px, 0.72vw, 12px);
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }
    .ix-content-stats {
      display: flex;
      align-items: center;
      gap: clamp(20px, 2vw, 40px);
      flex-shrink: 0;
    }
    .ix-stat {
      font-family: var(--ff-mono);
      font-size: clamp(10px, 0.72vw, 12px);
      color: var(--text-muted);
      text-align: right;
      white-space: nowrap;
    }
    .ix-stat strong {
      font-family: var(--ff-display);
      font-size: clamp(20px, 2vw, 32px);
      font-weight: 700;
      background: var(--aurora);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      display: block;
      line-height: 1;
    }

    /* ── Module grid ── */
    .ix-module-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(10px, 1.2vh, 16px);
      flex: 1;
      min-height: 0;
      margin-top: clamp(14px, 2vh, 24px);
      align-content: start;
      overflow-y: auto;
      padding-bottom: 1vh;
    }
    .ix-module-grid::-webkit-scrollbar { width: 4px; }
    .ix-module-grid::-webkit-scrollbar-track { background: transparent; }
    .ix-module-grid::-webkit-scrollbar-thumb { background: var(--ink-line); border-radius: 4px; }

    /* ── Module card ── */
    .ix-module-card {
      display: flex;
      align-items: stretch;
      gap: 0;
      text-decoration: none;
      background: var(--ink-soft);
      border: 1px solid var(--ink-line);
      border-radius: 12px;
      overflow: hidden;
      transition: border-color 0.22s ease, transform 0.22s var(--ease-out), box-shadow 0.22s ease;
      opacity: 0;
      animation: ix-rise 0.45s var(--ease-out) calc(var(--i) * 45ms + 0.18s) forwards;
      min-height: clamp(72px, 9vh, 104px);
    }
    .ix-module-card:hover {
      transform: translateX(4px);
      border-color: rgba(123,77,255,0.45);
      box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    }
    .ix-module-card:hover .ix-mod-num-wrap { background: var(--aurora); }
    .ix-module-card:hover .ix-mod-num      { -webkit-text-fill-color: #fff; background: none; color: #fff; }
    .ix-module-card:hover .ix-mod-arrow    { opacity: 1; transform: translateX(3px); }

    .ix-mod-num-wrap {
      width: clamp(56px, 5vw, 80px);
      display: grid;
      place-items: center;
      background: rgba(123,77,255,0.08);
      border-right: 1px solid var(--ink-line);
      flex-shrink: 0;
      transition: background 0.22s ease;
    }
    .ix-mod-num {
      font-family: var(--ff-display);
      font-size: clamp(15px, 1.3vw, 22px);
      font-weight: 700;
      background: var(--aurora);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.02em;
    }

    .ix-mod-title {
      font-family: var(--ff-display);
      font-size: clamp(13px, 1.05vw, 17px);
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
      line-height: 1.3;
      flex: 1;
      padding: 0 clamp(16px, 1.4vw, 24px);
      display: flex;
      align-items: center;
    }

    .ix-mod-right {
      display: flex;
      align-items: center;
      gap: 0.8vw;
      padding-right: clamp(14px, 1.2vw, 20px);
      flex-shrink: 0;
    }
    .ix-mod-count {
      font-family: var(--ff-mono);
      font-size: clamp(10px, 0.72vw, 12px);
      color: var(--text-muted);
      white-space: nowrap;
    }
    .ix-mod-count strong { color: var(--cyan); font-weight: 500; }

    .ix-mod-arrow {
      display: grid;
      place-items: center;
      width: clamp(26px, 1.8vw, 32px);
      height: clamp(26px, 1.8vw, 32px);
      border-radius: 7px;
      background: rgba(123,77,255,0.1);
      border: 1px solid rgba(123,77,255,0.2);
      opacity: 0.4;
      flex-shrink: 0;
      transition: opacity 0.2s ease, transform 0.22s var(--ease-out);
    }
    .ix-mod-arrow svg {
      width: 11px; height: 11px;
      stroke: var(--violet);
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; opacity: 1 !important; }
    }

    /* ── Responsive: móvil y tablet ─────────────────────────────────────
       El layout de dos columnas (cursos | módulos) necesita bastante ancho
       y se queda muy justo en tablets (iPad Air 1180px en horizontal); por
       debajo de 1200px apilamos: cabecera, selector de cursos en fila con
       scroll horizontal y la lista de módulos a una columna y ancho completo. */
    @media (max-width: 1199px) {
      html, body { overflow-x: hidden; overflow-y: auto; height: auto; }

      .ix {
        position: static;
        height: auto;
        min-height: 100vh;
        padding: 24px 18px 40px;
        overflow: visible;
      }

      /* Las formas ambientales se posicionan fuera del viewport y, con .ix en
         overflow visible, provocaban scroll horizontal: se ocultan en móvil. */
      .ix-blob { display: none; }

      /* Header: dejar respirar y ocultar el rótulo central */
      .ix-header { flex-wrap: wrap; gap: 6px 16px; padding-bottom: 16px; }
      .ix-header-center { display: none; }
      .ix-header-right-group { gap: 12px; margin-left: auto; }

      /* Cuerpo en vertical */
      .ix-body { flex-direction: column; margin-top: 20px; gap: 22px; }

      /* Sidebar → tira de cursos con scroll horizontal */
      .ix-sidebar {
        width: 100%;
        gap: 12px;
        padding-right: 0;
        border-right: none;
      }
      #course-list {
        flex-direction: row;
        overflow-x: auto;
        gap: 12px;
        padding-bottom: 8px;
        scroll-snap-type: x proximity;
        -webkit-overflow-scrolling: touch;
      }
      #course-list::-webkit-scrollbar { height: 4px; }
      #course-list::-webkit-scrollbar-thumb { background: var(--ink-line); border-radius: 4px; }
      .ix-course-card { width: auto; min-width: 200px; max-width: 260px; flex: 0 0 auto; scroll-snap-align: start; }

      /* Contenido: título + stats apilados, módulos a una columna */
      .ix-content { padding-left: 0; }
      .ix-content-header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .ix-content-stats { gap: 28px; }
      .ix-module-grid {
        grid-template-columns: 1fr;
        overflow: visible;
        min-height: auto;
        margin-top: 16px;
      }
    }
  </style>
</head>

  <!-- Body -->

</div>

  const UI = {
    es: {
      tagline: 'Biblioteca de presentaciones',
      sidebarLabel: 'Grupos',
      modules: 'módulos',
      slides: 'slides',
      slAbbr: 'sl.',
      completeCourse: 'Curso completo',
      spanishOnly: 'Solo disponible en español',
      ariaModules: (title) => `Módulos de ${title}`,
      ariaCard: (m) => `Módulo ${m.num}: ${t(m, 'title')} · ${m.slides} slides`,
    },
    en: {
      tagline: 'Presentation library',
      sidebarLabel: 'Groups',
      modules: 'modules',
      slides: 'slides',
      slAbbr: 'sl.',
      completeCourse: 'Complete course',
      spanishOnly: 'Spanish only — no English version yet',
      ariaModules: (title) => `Modules for ${title}`,
      ariaCard: (m) => `Module ${m.num}: ${t(m, 'title')} · ${m.slides} slides`,
    },
  };

  let active = 'personal';
  let lang = localStorage.getItem('slidesLang') || 'es';
  const arrow = `<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>`;

  // Devuelve el campo en el idioma activo si existe traducción, si no cae al español.
  function t(obj, field) {
    if (lang === 'en' && obj[field + '_en']) return obj[field + '_en'];
    return obj[field];
  }
  function hrefOf(m) {
    return (lang === 'en' && m.href_en) ? m.href_en : m.href;
  }
  function courseHasEn(c) {
    return c.modules.some(m => m.href_en);
  }

  function renderLangToggle() {
    document.querySelectorAll('.ix-lang-btn').forEach(btn => {
      btn.classList.toggle('is-active', btn.dataset.lang === lang);
      btn.setAttribute('aria-pressed', String(btn.dataset.lang === lang));
    });
    document.documentElement.lang = lang;
    document.getElementById('header-tagline').textContent = UI[lang].tagline;
    document.getElementById('sidebar-label').textContent = UI[lang].sidebarLabel;
  }

  function renderSidebar() {
    const el = document.getElementById('course-list');
    el.innerHTML = COURSES.map(c => {
      const total = c.modules.reduce((s, m) => s + m.slides, 0);
      const title = t(c, 'title');
      const showSpanishNote = lang === 'en' && !courseHasEn(c) && UI[lang].spanishOnly;
      return `<button class="ix-course-card${c.id === active ? ' is-active' : ''}"
        data-id="${c.id}" aria-pressed="${c.id === active}">
        <span class="ix-course-title">${title}</span>
        <span class="ix-course-meta">
          <span class="ix-course-sub">${c.modules.length} ${UI[lang].modules} · ${total} ${UI[lang].slides}</span>
          <span class="ix-course-badge">${c.year}</span>
        </span>
        ${showSpanishNote ? `<span class="ix-course-sub ix-course-sub-lang">${showSpanishNote}</span>` : ''}
      </button>`;
    }).join('');
    el.querySelectorAll('.ix-course-card').forEach(btn => {
      btn.addEventListener('click', () => {
        if (btn.dataset.id === active) return;
        active = btn.dataset.id;
        renderSidebar();
        renderContent();
        // En móvil la lista de cursos es una tira horizontal: traer el activo a la vista
        const activeBtn = el.querySelector('.ix-course-card.is-active');
        if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
      });
    });
  }

  function renderContent() {
    const c     = COURSES.find(x => x.id === active);
    const total = c.modules.reduce((s, m) => s + m.slides, 0);
    const title = t(c, 'title');
    document.getElementById('content').innerHTML = `
      <div class="ix-content-header">
        <div>
          <h2 class="ix-content-title"><span>${title}</span></h2>
          <p class="ix-content-subtitle">${c.year} · ${UI[lang].completeCourse}</p>
        </div>
        <div class="ix-content-stats">
          <div class="ix-stat"><strong>${c.modules.length}</strong>${UI[lang].modules}</div>
          <div class="ix-stat"><strong>${total}</strong>${UI[lang].slides}</div>
        </div>
      </div>
      <nav class="ix-module-grid" aria-label="${UI[lang].ariaModules(title)}">
        ${c.modules.map((m, i) => `
          <a class="ix-module-card" href="${hrefOf(m)}" style="--i:${i}"
            aria-label="${UI[lang].ariaCard(m)}">
            <div class="ix-mod-num-wrap" aria-hidden="true">
              <span class="ix-mod-num">${m.num}</span>
            </div>
            <span class="ix-mod-title">${t(m, 'title')}</span>
            <div class="ix-mod-right">
              <span class="ix-mod-count"><strong>${m.slides}</strong> ${UI[lang].slAbbr}</span>
              <span class="ix-mod-arrow" aria-hidden="true">${arrow}</span>
            </div>
          </a>`).join('')}
      </nav>`;
  }

  document.querySelectorAll('.ix-lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.lang === lang) return;
      lang = btn.dataset.lang;
      localStorage.setItem('slidesLang', lang);
      renderLangToggle();
      renderSidebar();
      renderContent();
    });
  });

  renderLangToggle();
  renderSidebar();
  renderContent();
})();
</script>

</body>
</html>
